appId: com.paperpolish.app
productName: PaperPolish
directories:
  buildResources: resources
  output: release
files:
  - dist/**
  - dist-electron/**
  - resources/icon.png
  - package.json
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{vite.config.ts,postcss.config.js,tailwind.config.js}"
  - "!**/*.{map,log,sqlite,sqlite3,db,bak,pdb,ilk,obj}"
  - "!**/*.{sqlite,sqlite3,db}-*"
  - "!**/{config.json,config.temp.json,config.local.json,github_token,credentials.json,secrets.json,.npmrc}"
  - "!**/.env*"
  - "!**/node_modules/better-sqlite3/{src,deps}/**"
  - "!**/node_modules/better-sqlite3/build/Release/obj/**"
asar: true
asarUnpack:
  - "**/*.node"
afterPack: scripts/after-pack.cjs
publish: null
win:
  executableName: PaperPolish
  icon: resources/icon.png
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${productName}-${version}-portable.${ext}
npmRebuild: true
